<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brands Galaxy Hero Section</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        .content-overlay {
            position: relative;
            z-index: 10;
        }
        /* Custom font import if needed */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <!-- Hero Text Content -->
    <div class="content-overlay relative z-10 flex flex-col items-center justify-center w-full h-screen p-4 text-center text-white bg-black bg-opacity-30 pointer-events-none">
        <div class="pointer-events-auto">
            <h1 class="text-5xl font-bold tracking-tight text-white md:text-7xl lg:text-8xl">
              Our Brand Universe
            </h1>
            <p class="max-w-2xl mt-6 text-lg text-gray-300 md:text-xl">
              We partner with a diverse galaxy of innovative brands, each a star in its own right. Explore the ecosystem of excellence we've built together.
            </p>
            <div class="mt-10">
              <a href="#" class="px-8 py-4 text-lg font-semibold text-black bg-white rounded-lg shadow-lg hover:bg-gray-200 transition-colors duration-300">
                Explore Partnerships
              </a>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 18);

        const canvas = document.getElementById('bg-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // --- Controls ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableZoom = false;
        controls.enablePan = false;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.3;
        controls.minPolarAngle = Math.PI / 3;
        controls.maxPolarAngle = (Math.PI * 2) / 3;

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 2);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 1);
        pointLight.position.set(10, 10, 10);
        scene.add(pointLight);

        // --- Logo Configuration ---
        const LOGO_URLS = [
          'https://placehold.co/300x300/1a1a1a/ffffff?text=Brand+1',
          'https://placehold.co/300x300/3a3a3a/ffffff?text=Brand+2',
          'https://placehold.co/300x300/5a5a5a/ffffff?text=Brand+3',
          'https://placehold.co/300x300/7a7a7a/ffffff?text=Brand+4',
          'https://placehold.co/300x300/9a9a9a/000000?text=Brand+5',
          'https://placehold.co/300x300/bababa/000000?text=Brand+6',
          'https://placehold.co/300x300/dadada/000000?text=Brand+7',
          'https://placehold.co/300x300/fafafa/000000?text=Brand+8',
          'https://placehold.co/300x300/1a1a1a/ffffff?text=Brand+9',
          'https://placehold.co/300x300/3a3a3a/ffffff?text=Brand+10',
          'https://placehold.co/300x300/5a5a5a/ffffff?text=Brand+11',
          'https://placehold.co/300x300/7a7a7a/ffffff?text=Brand+12',
          'https://placehold.co/300x300/9a9a9a/000000?text=Brand+13',
          'https://placehold.co/300x300/bababa/000000?text=Brand+14',
          'https://placehold.co/300x300/dadada/000000?text=Brand+15',
          'https://placehold.co/300x300/fafafa/000000?text=Brand+16',
        ];

        const textureLoader = new THREE.TextureLoader();
        const logoMeshes = [];
        const clock = new THREE.Clock();

        // --- Create Logos ---
        LOGO_URLS.forEach((url, index) => {
            textureLoader.load(url, (texture) => {
                const geometry = new THREE.PlaneGeometry(1.5, 1.5);
                const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, alphaTest: 0.5 });
                const mesh = new THREE.Mesh(geometry, material);

                // Store animation properties directly on the mesh object
                mesh.userData.radius = 4 + Math.random() * 8;
                mesh.userData.speed = 0.05 + Math.random() * 0.15;
                mesh.userData.initialAngle = (index / LOGO_URLS.length) * Math.PI * 2;
                mesh.userData.yPosition = (Math.random() - 0.5) * 8;
                const scale = 0.8 + Math.random() * 0.8;
                mesh.scale.set(scale, scale, scale);
                
                logoMeshes.push(mesh);
                scene.add(mesh);
            });
        });

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            logoMeshes.forEach(mesh => {
                const { radius, speed, initialAngle, yPosition } = mesh.userData;
                const angle = initialAngle + elapsedTime * speed;

                mesh.position.x = radius * Math.cos(angle);
                mesh.position.z = radius * Math.sin(angle);
                mesh.position.y = yPosition + Math.sin(elapsedTime * speed * 0.5) * 2;
                
                mesh.lookAt(camera.position);
            });
            
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // --- Handle Window Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });

    </script>
</body>
</html>
